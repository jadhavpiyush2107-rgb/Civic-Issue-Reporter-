<div class="modal-overlay" id="complaintModal">
  <div class="complaint-modal">
    <div class="modal-header">
      <h2>Add Report</h2>

      <button class="close-btn" id="closeComplaint">×</button>
    </div>

    <div class="modal-body">
      <label class="photo-upload">
        <input type="file" id="photoInput" accept="image/*" />

        <div class="upload-icon">▧</div>

        <span class="upload-title"> Add Photo </span>

        <small> Click to upload an image </small>
      </label>

      <p class="photo-info"></p>

      <div class="input-box">
        <span class="input-icon">↗</span>

        <input type="text" id="issueTitle" placeholder="Title" />
      </div>

      <div class="input-box select-box">
        <span class="input-icon">▦</span>

        <select id="category">
          <option value="">Category</option>
          <option value="Roads">Roads</option>
          <option value="Lighting">Lighting</option>
          <option value="Water">Water</option>
          <option value="Garbage">Garbage</option>
          <option value="Drainage">Drainage</option>
          <option value="Traffic">Traffic</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="input-box textarea-box">
        <span class="input-icon">☰</span>

        <textarea
          id="description"
          placeholder="Briefly describe the issue..."
        ></textarea>
      </div>

      <div class="input-box select-box">
        <span class="input-icon">⌖</span>

        <select id="location">
          <option value="">Location</option>
          <option value="Shirpur Main Road">Shirpur Main Road</option>

          <option value="Shirpur Bus Stand">Shirpur Bus Stand</option>

          <option value="R C Patel Area">R C Patel Area</option>

          <option value="Railway Station Road">Railway Station Road</option>

          <option value="Other">Other Location</option>
        </select>
      </div>

      <button class="submit-btn" id="submitComplaint">Submit</button>
    </div>
  </div>
</div>
